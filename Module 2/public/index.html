<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Idea Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="styles.css">

    </head>
    <body>
        <main id="main-content">
        <h1><b>Cards</b></h1>
        <div class="card-container">

            <!--BBQ CHICKEN WINGS-->
            <article class= "card">
                <img src="card-images/bbq-chicken-wings.jpg" alt="Picture of BBQ Chicken Wings">
                <h2 class= "title">
                    <b>BBQ Chicken Wings</b>
                </h2>
                <p class= "description">
                    Flavorful wings perfect for any occasion.
                </p>

            <!--DROP DOWN for BBQ Chicken Wings-->
            <button class="dropdown-menu-button" 
            type="button"  
            aria-expanded="false" 
            aria-controls="bbq-chicken-wings-dropdown-menu">More Info</button>
                <div class="dropdown-menu" 
                    id ="bbq-chicken-wings-dropdown-menu"
                    hidden
                    data-duration="45 minutes" 
                    data-difficulty="Medium" 
                    data-cuisine="Korean">
                </div>
            </article>
            

            <!--DROP BISCUITS-->
            <article class= "card">
                <img src="card-images/drop-biscuits.jpg" alt="Picture of Drop Biscuits">
                <h2 class= "title">
                    <b>Drop Biscuits</b>
                </h2>
                <p class= "description">
                    Delicious breakfast for the whole family.
                </p>

            <!--DROP DOWN for Drop Biscuits-->
                <button class="dropdown-menu-button" 
                type="button" 
                aria-expanded="false" 
                aria-controls="drop-biscuits-dropdown-menu">More Info</button>
                    <div class="dropdown-menu" 
                        id ="drop-biscuits-dropdown-menu"
                        hidden
                        data-duration="60 minutes" 
                        data-difficulty="Easy" 
                        data-cuisine="English">
                    </div>
            </article>


            <!--Chocolate Chip Cookies-->
            <article class= "card">
                <img src="card-images/chocolate-chip-cookies.png" alt="Picture of Chocolate Chip Cookies">
                <h2 class= "title">
                    <b>Chocolate Chip Cookies</b>
                </h2>
                <p class= "description">
                    Delicious cookie recipe.
                </p>

            <!--DROP DOWN for Chocolate Chip Cookies-->
                <button class="dropdown-menu-button" 
                type="button" 
                aria-expanded="false" 
                aria-controls="chocolate-chip-cookies-dropdown-menu">More Info</button>
                    <div class="dropdown-menu" 
                        id ="chocolate-chip-cookies-dropdown-menu"
                        hidden
                        data-duration="20 minutes" 
                        data-difficulty="Easy" 
                        data-cuisine="American">
                    </div>    
            </article>

        </div>
        <script src="script.js"></script>
    </main>
    </body>
</html>
