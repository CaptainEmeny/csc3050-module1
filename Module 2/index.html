<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Idea Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="styles.css">

    </head>
    <body>
        <h1><b>Cards</b></h1>
        <div class="card-container">

            <!--BBQ CHICKEN WINGS-->
            <div class= "card">
                <img src="card-images/bbq-chicken-wings.jpg" alt="Picture of BBQ Chicken Wings">
                <p class= "title">
                    <b>BBQ Chicken Wings</b>
                </p>
                <p class= "description">
                    Flavorful wings for my yummy dings
                </p>

            <!--DROP DOWN for BBQ Chicken Wings-->
            <button class="dropdown-button">More Info</button>
            <div class="dropdown-menu" 
            data-duration="45 minutes" 
            data-difficulty="Medium" 
            data-cuisine="Korean">
            </div>
            </div>
            

            <!--DROP BISCUITS-->
            <div class= "card">
                <img src="card-images/drop-biscuits.jpg" alt="Picture of Drop Biscuits">
                <p class= "title">
                    <b>Drop Biscuits</b>
                </p>
                <p class= "description">
                    Delicious breakfast for the whole family.
                </p>

            <!--DROP DOWN for Drop Biscuits-->
            <button class="dropdown-button">More Info</button>
            <div class="dropdown-menu" 
            data-duration="60 minutes" 
            data-difficulty="Easy" 
            data-cuisine="English">
            </div>
            </div>


            <!--Chocolate Chip Cookies-->
            <div class= "card">
                <img src="card-images/chocolate-chip-cookies.png" alt="Picture of Chocolate Chop Cookies">
                <p class= "title">
                    <b>Chocolate Chip Cookies</b>
                </p>
                <p class= "description">
                    Delicious cookie recipe.
                </p>

            <!--DROP DOWN for Chocolate Chip Cookies-->
            <button class="dropdown-button">More Info</button>
                <div class="dropdown-menu" 
                data-duration="20 minutes" 
                data-difficulty="Easy" 
                data-cuisine="American">
                </div>    
            </div>

        </div>
    <script src="script.js"></script>
    </body>
</html>
